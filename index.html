<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" id="apple-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // Each studio installs as its own app: /s/<slug>/ gets its own manifest and icon.
      (function () {
        var m = location.pathname.match(/^\/s\/([a-z0-9-]+)/);
        var slug = m ? m[1] : '';
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = '/api/manifest' + (slug ? '?slug=' + slug : '');
        document.head.appendChild(l);
      })();
    </script>
    <!-- Telegram Mini App: when the site is opened from the bot, this adds Telegram's back button and theme. Outside Telegram it does nothing. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Запись в студию</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="lgf" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="5" result="n"/><feGaussianBlur in="n" stdDeviation="2" result="nb"/><feDisplacementMap in="SourceGraphic" in2="nb" scale="34" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
